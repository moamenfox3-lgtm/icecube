<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ice Cube | Menu</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap');

:root {
  --ice: #dff3fb;
  --navy: #0b2a4a;
  --cyan: #4fc3e8;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--ice);
  color: var(--navy);
  font-family: 'Poppins', sans-serif;
}

.hero {
  text-align: center;
  padding: 70px 20px 30px;
}

.logo {
  font-family: 'Playfair Display', serif;
  font-size: 3.5rem;
  letter-spacing: 0.25em;
  margin: 0;
}

.tagline {
  font-weight: 300;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  margin-top: 8px;
}

.cubes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 20px;
  max-width: 700px;
  margin: 0 auto;
  padding: 20px;
}

.cube {
  aspect-ratio: 1;
  background: var(--white);
  color: var(--navy);
  border: 2px solid var(--cyan);
  border-radius: 16px;
  font-family: inherit;
  font-size: 1.1rem;
  cursor: pointer;
}
</style>
</head>
<body>

  <header class="hero">
    <h1 class="logo">ICE CUBE</h1>
    <p class="tagline">Stay Cool</p>
  </header>

  <main class="cubes">
    <button class="cube" data-page="classics.html">Classics</button>
    <button class="cube" data-page="signature.html">Signature Drinks</button>
    <button class="cube" data-page="iced.html">Iced & Frappe</button>
    <button class="cube" data-page="matcha.html">Matcha</button>
    <button class="cube" data-page="mojito.html">Mojito</button>
    <button class="cube" data-page="desserts.html">Desserts</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
